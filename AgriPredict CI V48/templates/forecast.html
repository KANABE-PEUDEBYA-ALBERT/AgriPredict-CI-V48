{% extends 'base.html' %}{% block title %}Prévision des prix{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">PRÉVISION DES PRIX</p><h1 class="page-title-green">Prévision des prix</h1></div><a class="button secondary" href="{{ url_for('prices') }}">Voir l'historique des prix</a></div>
<form class="filter-form" method="get"><label>Culture<select name="product">{% for p in products %}<option value="{{ p }}" {% if p == product %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label><button class="button">Voir l’estimation</button></form>
<section class="panel"><h2>{% if prediction is not none %}{{ prediction }} FCFA/kg{% else %}Prévision indisponible{% endif %}</h2></section>

{% endblock %}
